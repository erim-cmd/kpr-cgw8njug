# Köprü — her PR'da ve main'e her gönderimde otomatik testler.
# Sunucu, anahtar veya internet gerekmez; npm paketi kurulmaz (testler bağımlılıksız).
name: Testler

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Sözdizimi, önbellek listesi, syllabus okuyucu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: JavaScript sözdizimi (node --check)
        run: |
          set -e
          for f in *.js functions/api/*.js test/*.mjs; do
            node --check "$f"
          done
          echo "Tüm dosyalar temiz."

      - name: sw.js önbellek listesi (SHELL) tutarlı mı
        run: node test/shell.mjs

      - name: Syllabus okuyucu testleri
        run: node test/check.mjs

      - name: Veri göçü (eski kayıtlar yeni biçime)
        run: node test/migrate.mjs

      - name: Asistan (internetsiz cevaplar)
        run: node test/asistan.mjs

      - name: Not girişi tuş takımı
        run: node test/grade-sheet.mjs

      - name: Not hesabı (bonus bileşenler)
        run: node test/grades.mjs

      - name: Seçmeli adayları
        run: node test/electives.mjs

      - name: Hocaya mail taslağı
        run: node test/mail.mjs

      - name: Bildirim zamanı (gösterim anındaki kalan süre, service worker kopyası)
        run: node test/reminders.mjs

      - name: Takvime aktarma (ders tekrarı dönem sonunda biter)
        run: node test/ics.mjs

      - name: Bugün ekranı (aynı iş iki kez görünmez)
        run: node test/today.mjs

      - name: Yedek al / yedekten yükle (kayıpsız, eski sürüm, bozuk dosya)
        run: node test/backup.mjs

      - name: Depoda sır yok (API anahtarı, şifre, .dev.vars)
        run: node test/secrets.mjs

      - name: Yapay zekâ ile okuma ayarsız çalışmaz (sunucu hazır olsa bile)
        run: node test/ai-gate.mjs

      - name: Kampüste — hava durumu (yalnız şehir koordinatı, önbellek, gizlenme)
        run: node test/weather.mjs

      - name: Profil ve ayarlar (eski işlevlerin yeni yeri, alt sayfalar TR/EN) + Ara
        run: node test/profile.mjs

      - name: PDF okuyucu (yazı tipi kodlaması, LaTeX aksanları)
        run: node test/doc-text.mjs

      - name: Ders adı başlık düzeni
        run: node test/title-case.mjs

      - name: Syllabus'u var olan derse birleştirme
        run: node test/merge.mjs

      - name: Görünüm (açık/koyu tema, kontrast)
        run: node test/theme.mjs

      - name: Yazı dili (docs/yazi-dili.md)
        run: node test/copy.mjs

      - name: Dil desteği (İngilizce sözlük, çevrilmemiş metin)
        run: node test/i18n.mjs

      - name: Ders kartı (en yakın iş)
        run: node test/courses.mjs

      - name: İngilizce okuyucu metinleri
        run: node test/reader-en.mjs

      - name: Yapay zekâ — Asistan, Seçmeli, CORS (sahte cevap)
        run: node test/ai-ask.mjs

      - name: Devam şartı — hafta seçimi, sınav haftaları sayılmaz
        run: node test/attendance.mjs

      - name: GNO — önceki not düşülmez (UMIS HESAPLA)
        run: node test/gno-retake.mjs

      - name: Cihazdaki veri — iki sekme, dolu depo, bozuk kayıt
        run: node test/store-safety.mjs
